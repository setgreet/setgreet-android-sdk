name: Update SDK Version

on:
  repository_dispatch:
    types: [android-sdk-release]

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.SDK_RELEASE_PAT }}

      - name: Extract version
        id: version
        env:
          VERSION: ${{ github.event.client_payload.version }}
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "::error::invalid version"; exit 1; }
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Update example app SDK version
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          sed -i 's/implementation("com.setgreet:setgreet:[^"]*")/implementation("com.setgreet:setgreet:'"$VERSION"'")/' example/app/build.gradle.kts

      - name: Commit, tag, and push
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Release $VERSION"
          git tag "$VERSION"
          git push origin main --tags

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.VERSION }}
          name: ${{ steps.version.outputs.VERSION }}
          generate_release_notes: true
